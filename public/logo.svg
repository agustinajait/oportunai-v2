<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DE0E0"/>
      <stop offset="100%" stop-color="#0B9DAC"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0B9DAC" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Top shine overlay for depth -->
  <rect x="5" y="5" width="90" height="45" rx="22" fill="url(#shine)"/>
  <!-- White play triangle (optically centered) -->
  <polygon points="36,26 36,74 75,50" fill="white" opacity="0.97"/>
</svg>
